---
name: "Auto Release"

on:
  workflow_run:
    workflows: ["Test & Lint"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: "Create Release"
    runs-on: "ubuntu-latest"
    # Only run if Test & Lint succeeded
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: "✏️ Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: "📋 Check if package.json changed"
        id: check_package
        run: |
          BEFORE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -z "$BEFORE_SHA" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only $BEFORE_SHA HEAD -- 'package.json' | wc -l)
            if [ "$CHANGED" -gt 0 ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: "🏷️ Get version tag"
        id: set_var
        run: echo "COMPONENT_VERSION=$(grep version package.json | cut -d ':' -f 2 | sed -e 's/[^0-9\.beta\-]//g')" >> $GITHUB_ENV
        if: steps.check_package.outputs.changed == 'true'

      - name: "🏷️ Check if tag exists already"
        uses: mukunku/tag-exists-action@v1.7.0
        id: "check_tag"
        with:
          tag: "v${{ env.COMPONENT_VERSION }}"
        if: steps.check_package.outputs.changed == 'true'

      - name: "⏭️ Skip if no package change or tag exists"
        run: echo "Skipping release - package.json unchanged or tag already exists"
        if: steps.check_package.outputs.changed != 'true' || steps.check_tag.outputs.exists == 'true'

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      - name: "📥 Install dependencies"
        run: npm ci
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      - name: "🔨 Build"
        run: npm run build
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      - name: "📝 Check if build output changed"
        id: check_build
        run: |
          if git diff --quiet flower-card.js flower-card.js.gz; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      - name: "🔀 Create PR with built files"
        run: |
          BRANCH_NAME="build/v${{ env.COMPONENT_VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add flower-card.js flower-card.js.gz
          git commit -m "Build flower-card.js for v${{ env.COMPONENT_VERSION }} [skip ci]"
          git push origin "$BRANCH_NAME"
          gh pr create --title "Build flower-card.js for v${{ env.COMPONENT_VERSION }}" \
            --body "Auto-generated PR to update built files for release v${{ env.COMPONENT_VERSION }}

          [skip ci]" \
            --base main \
            --head "$BRANCH_NAME"
          gh pr merge "$BRANCH_NAME" --merge --admin --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true' && steps.check_build.outputs.changed == 'true'

      - name: "🏷️ Create new tag"
        uses: rickstaa/action-create-tag@v1
        id: "tag_create"
        with:
          tag: "v${{ env.COMPONENT_VERSION }}"
          tag_exists_error: false
          message: "Version ${{ env.COMPONENT_VERSION }}"
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true'

      # GitHub's native release notes: auto-detects the previous tag (so a beta's
      # notes don't span back to the last stable) and buckets PRs by label per
      # .github/release.yml. Replaces the raw changelog-generator dump.
      - name: "👍 Create Stable release"
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          generate_release_notes: true
          name: "Version ${{ env.COMPONENT_VERSION }}"
          tag_name: "v${{ env.COMPONENT_VERSION }}"
          files: |
            flower-card.js
            flower-card.js.gz
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true' && contains(env.COMPONENT_VERSION, 'beta') == false

      - name: "🤞 Create Beta release"
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          name: "Version ${{ env.COMPONENT_VERSION }}"
          tag_name: "v${{ env.COMPONENT_VERSION }}"
          files: |
            flower-card.js
            flower-card.js.gz
        if: steps.check_package.outputs.changed == 'true' && steps.check_tag.outputs.exists != 'true' && contains(env.COMPONENT_VERSION, 'beta') == true
